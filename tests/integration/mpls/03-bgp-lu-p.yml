---
message: |
  The tested device (DUT) is a P-router. It runs BGP labeled unicast with an
  adjacent PE-router and another P-router (no LDP) and performs label switching.
  The validation test checks end-to-end connectivity across an MPLS core that
  uses hop-by-hop EBGP-LU for label distribution.

defaults.sources.extra: [ ../wait_times.yml, ../warnings.yml ]

mpls:
  bgp.ipv4: [ ebgp ]
  ldp: False

groups:
  _auto_create: True
  hosts:
    members: [ h1, h2 ]
    device: linux
    provider: clab
  pe:
    members: [ pe1, pe2 ]
    module: [ bgp, mpls ]
  p:
    members: [ dut, p2 ]
    module: [ bgp, mpls ]
  x_switches:
    members: [ pe1, pe2, p2 ]
    device: eos
    provider: clab

nodes:
  pe1:
    bgp.as: 65001
  dut:
    bgp.as: 65002
  p2:
    bgp.as: 65003
  pe2:
    bgp.as: 65004

links:
- h1:
  pe1:
- pe1-dut
- dut-p2
- p2-pe2
- pe2:
  h2:

validate:
  ebgp:
    description: Check EBGP sessions with DUT
    wait: ebgp_session
    wait_msg: Waiting for EBGP sessions
    nodes: [ pe1, p2 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')
    stop_on_error: true
  ping:
    description: Ping-based end-to-end reachability test
    wait_msg: We might have to wait a bit longer
    wait: ping_long
    nodes: [ h1 ]
    plugin: ping('h2')

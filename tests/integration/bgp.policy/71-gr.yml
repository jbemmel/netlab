---
message: |
  Test BGP graceful restart (bgp.gr) on dual-stack EBGP sessions. Validation runs on
  FRR probe nodes only:

  * Node-level bgp.gr on DUT (global GR) and X1 (helper mode)
  * Link-level bgp.gr on DUT-X2 overrides node-level GR with IPv6 only (ipv4: false)

defaults.sources.extra: [ defaults-ds.yml, ../wait_times.yml, ../warnings.yml ]

plugin: [ bgp.policy ]
module: [ bgp, ospf ]

groups:
  probes:
    device: frr
    provider: clab
    members: [ x1, x2 ]

nodes:
  dut:
    bgp.as: 65000
    bgp.gr:
      state: enable
      restart_time: 120
      stalepath_time: 360
  x1:
    bgp.as: 65100
    bgp.gr: helper
  x2:
    bgp.as: 65200

ospf.timers.hello: 1
ospf.timers.dead: 3

links:
- dut-x1
- dut:
    bgp.gr:
      ipv4: false
      ipv6: true
  x2:

validate:
  ebgp_v4:
    description: Check IPv4 EBGP sessions with DUT
    wait: ebgp_session
    nodes: [ x1, x2 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut')

  ebgp_v6:
    description: Check IPv6 EBGP sessions with DUT
    wait: ebgp_session
    nodes: [ x1, x2 ]
    plugin: bgp_neighbor(node.bgp.neighbors,'dut',af='ipv6')

  gr_x1_v4:
    description: Check node-level bgp.gr on DUT-X1 IPv4 session
    nodes: [ x1 ]
    plugin: |-
      bgp_neighbor_details(
        node.bgp.neighbors,'dut',
        gracefulRestartInfo={'remoteGrMode': 'Restart'})

  gr_x1_v6:
    description: Check node-level bgp.gr on DUT-X1 IPv6 session
    nodes: [ x1 ]
    plugin: |-
      bgp_neighbor_details(
        node.bgp.neighbors,'dut',af='ipv6',
        gracefulRestartInfo={'remoteGrMode': 'Restart'})

  gr_x2_v6:
    description: Check IPv6-only link-level bgp.gr override on DUT-X2 session
    nodes: [ x2 ]
    plugin: |-
      bgp_neighbor_details(
        node.bgp.neighbors,'dut',af='ipv6',
        gracefulRestartInfo={'remoteGrMode': 'Restart'})

  gr_x2_v4_off:
    description: Check IPv4 GR is disabled on DUT-X2 session (link override)
    nodes: [ x2 ]
    plugin: |-
      bgp_neighbor_details(
        node.bgp.neighbors,'dut',
        gracefulRestartInfo={'remoteGrMode': 'Disable'})

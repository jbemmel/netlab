message: |
  The device under test sits between a root bridge and a probe checking the path cost towards the root.
  The DUT should configure the long form port cost and report it downstream

module: [ vlan, stp ]

stp.protocol: pvrst # Some devices like Dell OS10 disable STP on VLANs if not in this mode

groups:
  _auto_create: true
  duts:
    members: [ dut ]
  probes:
    members: [ x1, x2 ]
    device: eos
    provider: clab

nodes:
  x1:
    stp.priority: 4096  # High STP bridge priority (low value) -> becomes root

vlans:
  red:
    mode: bridge
    id: 42

links:
- x1:
  dut:
    stp.port_cost: 200000000 # Max allowed cost, must use long form
  vlan.access: red
- dut:
  x2:                        # eos sets a default cost of 20000, based on link speed
  vlan.access: red

validate:
  port_cost:
    wait: 40
    wait_msg: Waiting for STP to enable all links
    nodes: [ x2 ]
    devices: [ eos ]
    pass: Root path cost sum is correct
    fail: Root path cost is incorrect; dut likely not setting cost correctly
    stop_on_error: True
    show: spanning-tree | json
    valid: |
      spanningTreeInstances.VL42.rootPort.cost.externalCost == 200020000

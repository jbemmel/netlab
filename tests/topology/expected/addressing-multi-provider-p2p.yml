groups:
  core:
    members:
    - c1
    - c2
  tor:
    members:
    - l1
input:
- topology/input/addressing-multi-provider-p2p.yml
- package:topology-defaults.yml
links:
- _linkname: links[1]
  interfaces:
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.0/31
    node: c1
  - ifindex: 1
    ifname: eth1
    ipv4: 10.1.0.1/31
    node: c2
  linkindex: 1
  node_count: 2
  pool: p2p
  prefix:
    ipv4: 10.1.0.0/31
  type: p2p
name: input
nodes:
  c1:
    af:
      ipv4: true
    box: quay.io/frrouting/frr:10.0.1
    clab:
      binds:
      - clab_files/c1/daemons:/etc/frr/daemons
      - clab_files/c1/hosts:/etc/hosts
      config_templates:
      - daemons:/etc/frr/daemons
      - hosts:/etc/hosts
      kind: linux
    device: frr
    hostname: clab-input-c1
    id: 1
    interfaces:
    - ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.0/31
      linkindex: 1
      mtu: 1500
      name: c1 -> c2
      neighbors:
      - ifname: eth1
        ipv4: 10.1.0.1/31
        node: c2
      pool: p2p
      type: p2p
    loopback:
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.1/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.101
      mac: 08:4f:a9:00:00:01
    mtu: 1500
    name: c1
  c2:
    af:
      ipv4: true
    box: quay.io/frrouting/frr:10.0.1
    clab:
      binds:
      - clab_files/c2/daemons:/etc/frr/daemons
      - clab_files/c2/hosts:/etc/hosts
      config_templates:
      - daemons:/etc/frr/daemons
      - hosts:/etc/hosts
      kind: linux
    device: frr
    hostname: clab-input-c2
    id: 2
    interfaces:
    - ifindex: 1
      ifname: eth1
      ipv4: 10.1.0.1/31
      linkindex: 1
      mtu: 1500
      name: c2 -> c1
      neighbors:
      - ifname: eth1
        ipv4: 10.1.0.0/31
        node: c1
      pool: p2p
      type: p2p
    loopback:
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.2/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.102
      mac: 08:4f:a9:00:00:02
    mtu: 1500
    name: c2
  l1:
    af:
      ipv4: true
    box: quay.io/frrouting/frr:10.0.1
    clab:
      binds:
      - clab_files/l1/daemons:/etc/frr/daemons
      - clab_files/l1/hosts:/etc/hosts
      config_templates:
      - daemons:/etc/frr/daemons
      - hosts:/etc/hosts
      kind: linux
    device: frr
    hostname: clab-input-l1
    id: 3
    interfaces: []
    loopback:
      ifindex: 0
      ifname: lo
      ipv4: 10.0.0.3/32
      neighbors: []
      type: loopback
      virtual_interface: true
    mgmt:
      ifname: eth0
      ipv4: 192.168.121.103
      mac: 08:4f:a9:00:00:03
    mtu: 1500
    name: l1
provider: clab

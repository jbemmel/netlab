# SRv6 over IS-IS using BGP and/or BGP L3VPN v4/v6 as control plane
#
# Modeled similar to the MPLS module
#
config_after: [ vlan, isis, ospf, bgp ]
transform_after: [ vlan, bgp, vrf ]
no_propagate: [ locator_pool ]

locator_pool: 5F00::/16     # Default address pool for locators based on the IANA reserved range in RFC9602
                            # See https://datatracker.ietf.org/doc/html/rfc9602
igp: [ isis ]               # By default, enable SRv6 over IS-IS

attributes:
  global:
    bgp: # BGP v4/v6 AF
      _alt_types: [ bool, BoxList ]
      ipv4: { type: list, true_value: [ ibgp ], valid_values: [ ibgp, ebgp ] }
      ipv6: { type: list, true_value: [ ibgp ], valid_values: [ ibgp ] }
    igp: { type: list, valid_values: [ isis, ospf, ebgp ] }
    vpn: # BGP VPN v4/v6
      _alt_types: [ bool, BoxList ]
      ipv4: { type: list, true_value: [ ibgp ], valid_values: [ ibgp ] }
      ipv6: { type: list, true_value: [ ibgp ], valid_values: [ ibgp ] }
    locator_pool: { type: ipv6, use: subnet_prefix }
    _obsolete:
      allocate_loopback: This attribute is obsolete and does nothing

  node:
    bgp:
    igp:
    vpn:
    locator: { type: ipv6, use: subnet_prefix }
    local_sids:
      type: dict
      _keytype: id
      _subtype:
        type: dict
        _keys:
          prefix: { type: ipv6, use: subnet_prefix }
          behavior:
            type: str
            _required: True
            # Base names from the IANA SRv6 Endpoint Behaviors registry.
            # Flavored registrations are represented by behavior + flavors.
            # https://www.iana.org/assignments/segment-routing/ (2026-10-19)
            valid_values:
            - End
            - End.X
            - End.T
            - End.B6.Insert
            - End.B6.Encaps
            - End.BM
            - End.DX6
            - End.DX4
            - End.DT6
            - End.DT4
            - End.DT46
            - End.DX2
            - End.DX2V
            - End.DT2U
            - End.DT2M
            - End.B6.Insert.Red
            - End.B6.Encaps.Red
            - End.MAP
            - End.Limit
            - End.M.GTP6.D
            - End.M.GTP6.Di
            - End.M.GTP6.E
            - End.M.GTP4.E
            - End.DTM
            - End.M
            - End.Replicate
            - End.DTMC4
            - End.DTMC6
            - End.DTMC46
            - End.BXC
            - End.NSH
            - End.LBS
            - End.XLBS
            - End.PSID
            - End.DTM46
            - End.DXM4
            - End.DXM6
            - End.DXM2
            - End.XU
            - End.DX1
            - End.AN
            - End.AS
            - End.AD
            - End.AM
            - End.AMN
            - End.M.GTP6.E.Red
            - End.AN.CI.S
            - End.AN.CI.D.A
            - End.AN.CI.D.T
            - End.AN.CI.D.V
            - End.AN.CI.D.D
          flavors:
            type: list
            valid_values: [ psp, usp, usd, next-csid, replace-csid, next-only-csid ]
          block_length: { type: int, min_value: 1, max_value: 120 }
          csid_length: { type: int, min_value: 1, max_value: 120 }
    transit_only: bool
    _obsolete:
      allocate_loopback: This attribute is obsolete and does nothing

features:
  local_sids: Explicit local SID behaviors and supported flavors (per-behavior dictionary)
  bgp: Supports BGP v4/v6 over SRv6
  vpn: Supports BGP L3VPN v4/v6 over SRv6
  isis: Supports SRv6 with IS-IS
  ospf: Supports SRv6 with OSPFv3
  ebgp: Supports EBGP propagation of SRv6 SIDs

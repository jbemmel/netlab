# bgp.policy default settings -- mostly attributes
#
---
attributes:
  bgp_gr:
    state:
      type: str
      valid_values: [ enable, disable, helper ]
      _required: True
    restart_time:
      type: int
      min_value: 0
      max_value: 4095
    stalepath_time:
      type: int
      min_value: 1
      max_value: 4095
    update_delay:
      type: int
      min_value: 1
      max_value: 3600
    ipv4: bool
    ipv6: bool
    _value_to_dict:
      state: '{value}'

#
# The device settings are mostly inherited from the 'routing' module, the only
# extra settings you can specify here are 'bandwidth' and '_default_locpref'
#

bgp:
  attributes:
    p_attr:                                               # BGP policy attributes
      direct: [ weight, prefix_filter, as_filter ]        # Things that can be applied directly to a neighbor
      node: [ locpref ]
      link: [ locpref, med ]
      interface: [ locpref, med, prepend, weight ]
      compound:                                           # Things that have to be applied to in/out policy
        locpref: in
        med: out
        prepend: out
        bandwidth: both

    interface:
      gr: bgp_gr
      policy:
        in: str
        out: str
      bandwidth:
        _alt_types: [ autobw ]
        in: autobw
        out: autobw

    link:
      gr: bgp_gr

    node:
      gr: bgp_gr
      aggregate:
        type: list
        _subtype:
          ipv4: { type: ipv4, use: prefix }
          ipv6: { type: ipv6, use: prefix }
          summary_only: bool
          suppress_policy: str
          attributes: str
          _alt_types: [ prefix_str ]
    vrf:
      gr:
        copy: node
      aggregate:
        copy: node

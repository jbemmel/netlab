# vxlan.l2tunnel attributes
#
---
devices:
  cumulus_nvue:
    features.vxlan.l2tunnel: True

vlan:
  attributes:
    global:
      l2_vxlan_tunnel: { type: str, valid_values: [ "all", "lacp", "stp", "lldp", "cdp" ] }
    node:
      l2_vxlan_tunnel: { type: str, valid_values: [ "all", "lacp", "stp", "lldp", "cdp" ] }
      # copy: global -> "must be a dict?"
    link:
      l2_vxlan_tunnel: { type: str, valid_values: [ "all", "lacp", "stp", "lldp", "cdp" ] }

---
description: Exergy Lab browser-based virtual network router
docname: exergy-lab
interface_name: eth{ifindex}
loopback_interface_name: lo{ifindex if ifindex else ""}
mgmt_if: eth0
role: router
support:
  level: minimal
group_vars:
  ansible_network_os: linux
  netlab_device_type: exergy-lab
  ansible_connection: docker
  ansible_user: root
  netlab_linux_distro: vanilla
  netlab_lldp_enable: True
  netlab_net_tools: False
clab:
  image: ghcr.io/exergy-connect/lab.net-go:latest
  node:
    kind: linux
    user: root
    env:
      LAB_NET_INITIAL_DONE_FILE: /var/run/initial.done
      LAB_NET_LLDP: "1"
    config_templates:
      relay: /config/exergy-lab.json
  node_config:
    initial: :ns
    bgp: :ns
    ospf: :ns
    isis: :ns
features:
  initial:
    config_mode: [ sh ]
    roles: [ router ]
    ipv6:
      lla: True
  bgp:
    activate_af: True
  ospf: {}
  isis: {}
attributes:
  node:
    exergy-lab:
      token: str
      port: { type: int, min_value: 1, max_value: 65535 }
      https: bool
graphite.icon: router
